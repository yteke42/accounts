<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Handmade Accounts - İletişim">

    <title>İletişim - Handmade Accounts</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/src/handmade_accounts.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <style>
        .contact-container {
            max-width: 600px;
            margin: var(--spacing-2xl) auto;
            padding: var(--spacing-xl);
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .contact-title {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-md);
            color: var(--color-accent-primary);
        }

        .contact-description {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-xl);
        }

        .contact-methods {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .contact-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md) var(--spacing-lg);
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition-base);
        }

        .contact-link:hover {
            border-color: var(--color-accent-primary);
            background: rgba(200, 155, 60, 0.1);
        }

        .contact-link .icon {
            font-size: 24px;
        }

        .back-link {
            display: inline-block;
            margin-top: var(--spacing-xl);
            color: var(--color-accent-secondary);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <img src="/src/handmade_accounts.png" alt="Logo" class="logo-icon-img">
                <h1>Handmade Accounts</h1>
            </div>
            <p class="tagline">İletişim</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" title="Tema Değiştir">
            <span class="icon-sun">☀️</span>
            <span class="icon-moon">🌙</span>
        </button>
    </header>

    <!-- ===== CONTACT CONTENT ===== -->
    <main class="main" style="display: flex; justify-content: center; padding: var(--spacing-xl);">
        <div class="contact-container">
            <h1 class="contact-title">İletişim</h1>
            <p class="contact-description">
                Hesaplarla ilgili sorularınız veya satın alma talepleriniz için bizimle iletişime geçin.
            </p>

            <div class="contact-methods">
                <!-- Add your contact methods here -->
                <a href="#" class="contact-link">
                    <span class="icon">💬</span>
                    <span>Discord</span>
                </a>
                <a href="https://www.itemsatis.com/p/HandmadeAccounts" target="_blank" class="contact-link">
                    <span class="icon">📱</span>
                    <span>Itemsatış</span>
                </a>
            </div>

            <a href="index.html" class="back-link">← Ana Sayfaya Dön</a>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>© 2026 Handmade Accounts.</p>
    </footer>

    <script>
        // Theme toggle
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        });
    </script>
</body>

</html>
