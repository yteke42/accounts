<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Handmade Accounts - Cayma Hakkı & İade Politikası">
    <title>Cayma Hakkı & İade Politikası - Handmade Accounts</title>
    <link rel="icon" type="image/png" href="/src/handmade_accounts.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .legal-container {
            max-width: 800px;
            margin: var(--spacing-2xl) auto;
            padding: var(--spacing-xl);
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
        }

        .legal-title {
            font-size: var(--font-size-2xl);
            margin-bottom: var(--spacing-lg);
            color: var(--color-accent-primary);
        }

        .legal-content {
            color: var(--color-text-secondary);
            line-height: 1.8;
        }

        .legal-content h2 {
            color: var(--color-text-primary);
            margin-top: var(--spacing-xl);
            margin-bottom: var(--spacing-sm);
        }

        .legal-content p {
            margin-bottom: var(--spacing-md);
        }

        .back-link {
            display: inline-block;
            margin-top: var(--spacing-xl);
            color: var(--color-accent-secondary);
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-content">
            <div class="logo">
                <a href="/" class="logo-link">
                    <img src="/src/handmade_accounts.png" alt="Logo" class="logo-icon-img">
                    <h1>Handmade Accounts</h1>
                </a>
            </div>
            <p class="tagline">Cayma Hakkı & İade Politikası</p>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" title="Tema Değiştir">
                <span class="icon-sun">☀️</span>
                <span class="icon-moon">🌙</span>
            </button>
        </div>
    </header>

    <!-- ===== CONTENT ===== -->
    <main class="main" style="display: flex; justify-content: center; padding: var(--spacing-xl);">
        <div class="legal-container">
            <h1 class="legal-title">Cayma Hakkı & İade Politikası</h1>
            <div class="legal-content">
                <!-- İçeriği buraya ekleyin -->
                <p>Bu sayfa yakında güncellenecektir.</p>
            </div>
            <a href="/" class="back-link">← Ana Sayfaya Dön</a>
        </div>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="footer-links">
            <a href="hizmet-kosullari.html">Hizmet Koşulları</a>
            <span class="footer-sep">·</span>
            <a href="iade-politikasi.html">Cayma Hakkı & İade Politikası</a>
        </div>
        <p>© 2026 Handmade Accounts.</p>
    </footer>

    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        });
    </script>
</body>

</html>
